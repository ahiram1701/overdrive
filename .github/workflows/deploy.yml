name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar dist/ con versión de caché por commit
        run: |
          mkdir dist
          cp -r index.html style.css manifest.webmanifest sw.js js icons dist/
          VERSION="overdrive-${GITHUB_SHA::7}"
          sed -i "s/const CACHE = 'overdrive-v1';/const CACHE = '${VERSION}';/" dist/sw.js
          grep -q "${VERSION}" dist/sw.js || { echo "No se pudo versionar sw.js"; exit 1; }
          echo "Versión de caché: ${VERSION}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
