name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # en main la CI la lanza deploy.yml antes de desplegar
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: ci-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test:unit

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (partida con bot)
        run: npm run test:e2e

      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
